---
# cPanel Git Version Control deploy task for admin.meshmadrasa.com.
#
# This file lives in web/ (not just in build/web) so that `flutter build web`
# copies it into the deploy repo on every build. Keeping it only in build/web
# means a `flutter clean` silently deletes it and deployments stop copying
# anything, with no error.
#
# cPanel runs these tasks after "Deploy HEAD Commit". Pushing to GitHub alone
# does not deploy — cPanel must pull (Update from Remote) and then deploy.
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html/admin.meshmadrasa.com/
    - /bin/mkdir -p $DEPLOYPATH
    # Avoid wildcard deployment: recursively copy generated files, but never
    # copy repository metadata or cPanel's deployment instructions themselves.
    - /usr/bin/find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .cpanel.yml ! -name .gitignore ! -name .last_build_id -exec /bin/cp -R {} $DEPLOYPATH \;
